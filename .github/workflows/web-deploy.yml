name: Web Deploy

on:
  push:
    branches: [ "main" ]
    paths:
      - 'web/**'

jobs:
  web_build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Vite App
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install and Build Web
      working-directory: ./web
      run: |
        npm install
        npm run build

